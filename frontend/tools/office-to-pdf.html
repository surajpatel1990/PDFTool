<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Office to PDF</title>
<link rel="stylesheet" href="../css/style.css">
<script src="../js/server-convert.js"></script>
</head>
<body>
<header><h1>Word / PowerPoint / Excel to PDF</h1></header>
<div class="tool-page">
  <div class="dropzone" id="drop">Drop a .docx/.pptx/.xlsx file here or click to select</div>
  <input type="file" id="fileInput" accept=".docx,.pptx,.xlsx" hidden>
  <div id="status"></div>
  <button id="convertBtn" disabled>Convert & Download</button>
</div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const status = document.getElementById('status');
const convertBtn = document.getElementById('convertBtn');
let currentFile = null;

drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('dragover'); };
drop.ondragleave = () => drop.classList.remove('dragover');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); };
fileInput.onchange = () => handleFile(fileInput.files[0]);

function handleFile(file) {
  if (!file) return;
  currentFile = file;
  status.textContent = file.name;
  convertBtn.disabled = false;
}

convertBtn.onclick = async () => {
  convertBtn.disabled = true;
  try {
    await convertOnServer(currentFile, 'pdf', status, 'converted.pdf');
  } catch (e) {}
  convertBtn.disabled = false;
};
</script>
</body>
</html>
