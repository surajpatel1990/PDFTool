<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PDF to JPG</title>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-BSG00T9GEC"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag("js", new Date());
  gtag("config", "G-BSG00T9GEC");
</script>
</head>
<body>
<header><h1>PDF to JPG</h1></header>
<div class="tool-page">
  <div class="dropzone" id="drop">Drop a PDF here or click to select</div>
  <input type="file" id="fileInput" accept="application/pdf" hidden>
  <div id="status"></div>
  <div id="pages"></div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const status = document.getElementById('status');
const pagesDiv = document.getElementById('pages');

drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('dragover'); };
drop.ondragleave = () => drop.classList.remove('dragover');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); };
fileInput.onchange = () => handleFile(fileInput.files[0]);

async function handleFile(file) {
  if (!file) return;
  pagesDiv.innerHTML = '';
  status.textContent = 'Rendering...';
  const bytes = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 2 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    const link = document.createElement('a');
    link.href = canvas.toDataURL('image/jpeg', 0.92);
    link.download = `page-${i}.jpg`;
    link.textContent = `Download page ${i}`;
    const wrap = document.createElement('div');
    wrap.style.margin = '1rem 0';
    wrap.appendChild(canvas);
    wrap.appendChild(document.createElement('br'));
    wrap.appendChild(link);
    pagesDiv.appendChild(wrap);
  }
  status.textContent = `Done — ${pdf.numPages} pages`;
}
</script>
</body>
</html>
