<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PDF to Word</title>
<link rel="stylesheet" href="../css/style.css">
<script src="../js/server-convert.js"></script>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-BSG00T9GEC"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag("js", new Date());
  gtag("config", "G-BSG00T9GEC");
</script>
</head>
<body>
<header><h1>PDF to Excel (.xlsx)</h1></header>
<div class="tool-page">
  <div class="dropzone" id="drop">Drop a PDF here or click to select</div>
  <input type="file" id="fileInput" accept="application/pdf" hidden>
  <div id="status"></div>
  <button id="convertBtn" disabled>Convert & Download</button>
</div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const status = document.getElementById('status');
const convertBtn = document.getElementById('convertBtn');
let currentFile = null;

drop.onclick = () => fileInput.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('dragover'); };
drop.ondragleave = () => drop.classList.remove('dragover');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); };
fileInput.onchange = () => handleFile(fileInput.files[0]);

function handleFile(file) {
  if (!file) return;
  currentFile = file;
  status.textContent = file.name;
  convertBtn.disabled = false;
}

convertBtn.onclick = async () => {
  convertBtn.disabled = true;
  try {
    await convertOnServer(currentFile, 'xlsx', status, 'converted.xlsx');
  } catch (e) {}
  convertBtn.disabled = false;
};
</script>
</body>
</html>
